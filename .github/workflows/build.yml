name: Build Winlator APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.3.13750724

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --build-cache --stacktrace

      - name: Locate Built APK
        id: locate_apk
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::Built APK not found in app/build/outputs/apk/debug!"
            exit 1
          fi
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename "$APK_FILE")" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_FILE ($(du -h "$APK_FILE" | cut -f1))"

      - name: Upload APK to GoFile
        id: upload_gofile
        run: |
          APK_PATH="${{ steps.locate_apk.outputs.apk_path }}"
          echo "Fetching active GoFile upload server..."
          SERVER_RESP=$(curl -s --connect-timeout 10 --max-time 30 https://api.gofile.io/servers || echo "{}")
          SERVER=$(echo "$SERVER_RESP" | jq -r '.data.servers[0].name // empty')
          
          if [ -z "$SERVER" ] || [ "$SERVER" = "null" ]; then
            echo "Falling back to default server 'store1'..."
            SERVER="store1"
          fi
          
          echo "Uploading $APK_PATH to https://${SERVER}.gofile.io/contents/uploadfile ..."
          UPLOAD_RESP=$(curl --connect-timeout 15 --max-time 600 -F "file=@${APK_PATH}" "https://${SERVER}.gofile.io/contents/uploadfile")
          echo "Upload response: $UPLOAD_RESP"
          
          DOWNLOAD_PAGE=$(echo "$UPLOAD_RESP" | jq -r '.data.downloadPage // empty')
          
          if [ -n "$DOWNLOAD_PAGE" ] && [ "$DOWNLOAD_PAGE" != "null" ]; then
            echo "download_page=$DOWNLOAD_PAGE" >> $GITHUB_OUTPUT
            echo "::notice title=GoFile Download Link::Download page: $DOWNLOAD_PAGE"
            
            echo "### 🚀 Winlator Debug APK Build Succeeded!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **APK File**: \`${{ steps.locate_apk.outputs.apk_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Size**: $(du -h "$APK_PATH" | cut -f1)" >> $GITHUB_STEP_SUMMARY
            echo "- **GoFile Link**: [Click here to download](${DOWNLOAD_PAGE})" >> $GITHUB_STEP_SUMMARY
            echo "- **Direct Download Page**: \`${DOWNLOAD_PAGE}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "download_page=" >> $GITHUB_OUTPUT
            echo "::warning::GoFile upload could not extract downloadPage. Response: $UPLOAD_RESP"
            echo "### ⚠️ Winlator Debug APK Built (GoFile Upload Pending/Failed)" >> $GITHUB_STEP_SUMMARY
            echo "APK is available in GitHub Actions Artifacts below." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload GitHub Actions Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: winlator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
